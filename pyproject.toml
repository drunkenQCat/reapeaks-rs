[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "reapeaks"
version = "0.3.0"
description = "REAPER .ReaPeaks generator: streaming wave/spectral/loudness mipmaps (Rust core)"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
dependencies = []

[project.optional-dependencies]
test = ["numpy>=2.0"]

[tool.maturin]
features = ["py"]
module-name = "reapeaks"