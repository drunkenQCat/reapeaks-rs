[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "reapeaks"
version = "0.3.1"
description = "REAPER .ReaPeaks generator: streaming wave/spectral/loudness mipmaps (Rust core)"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }
dependencies = []

[project.optional-dependencies]
test = ["numpy>=2.0"]

[tool.maturin]
# extension-module 只在 maturin 打 wheel 时启用（pyo3 会跳过链接 libpython）；
# stub_gen 这个独立二进制需要链接 libpython，所以 Cargo.toml 里不带该 feature。
features = ["py", "pyo3/extension-module"]
module-name = "reapeaks._native"
python-source = "python"
# 桩是 gitignore 的构建产物，maturin 的 python-source 过滤会跳过它；
# 用 include 显式把它打进 wheel 与 sdist。
include = ["python/reapeaks/_native.pyi"]