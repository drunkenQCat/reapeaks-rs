[package]
name = "reapeaks"
version = "0.1.0"
edition = "2021"
description = "REAPER .ReaPeaks generator: streaming wave/spectral/loudness mipmaps, PyO3 bindings"
license = "MIT OR Apache-2.0"

[lib]
name = "reapeaks_rust"
crate-type = ["cdylib", "rlib"]

[features]
default = []
py = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.29.2", optional = true, features = ["extension-module", "abi3-py38"] }
rayon = "1.12"
realfft = "3.5"

[profile.release]
lto = true
codegen-units = 1
