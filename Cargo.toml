[package]
name = "reapeaks"
version = "0.3.1"
edition = "2021"
rust-version = "1.83"
description = "REAPER .ReaPeaks generator: streaming wave/spectral/loudness mipmaps, PyO3 bindings"
license = "MIT OR Apache-2.0"

[lib]
name = "reapeaks"
crate-type = ["cdylib", "rlib"]

[features]
default = []
py = ["dep:pyo3", "dep:pyo3-stub-gen"]

[dependencies]
pyo3 = { version = "0.29.2", optional = true, features = ["abi3-py310"] }
pyo3-stub-gen = { version = "0.23", default-features = false, features = ["infer_signature"], optional = true }
rayon = "1.12"
realfft = "3.5"

[[bin]]
name = "stub_gen"
path = "src/bin/stub_gen.rs"
required-features = ["py"]
doc = false

[profile.release]
lto = true
codegen-units = 1
